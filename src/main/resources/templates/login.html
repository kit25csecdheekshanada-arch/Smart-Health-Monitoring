<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Smart Patient Health Monitoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #f8fafc 100%);
            padding: 1.5rem;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            padding: 2.25rem;
        }
        .auth-brand-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0284c7, #0d9488);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 1rem;
        }
        .demo-chip {
            cursor: pointer;
            font-size: 0.76rem;
            padding: 0.35rem 0.65rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            transition: all 0.2s;
        }
        .demo-chip:hover {
            background: #e0f2fe;
            border-color: #0284c7;
            color: #0369a1;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="auth-brand-icon">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Smart Health Monitoring</h4>
            <p class="text-muted small">Sign in to access patient telemetry and alerts</p>
        </div>

        <!-- Success Flash Message -->
        <div th:if="${param.logout}" class="alert alert-success py-2 small d-flex align-items-center gap-2">
            <i class="bi bi-check-circle-fill"></i>
            <span>You have been signed out safely.</span>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2 small d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>Invalid username or password. Please try again.</span>
        </div>

        <div th:if="${successMessage}" class="alert alert-success py-2 small d-flex align-items-center gap-2">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold">Staff Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="e.g. admin or doctor" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label small fw-semibold">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
            </button>
        </form>

        <!-- Quick Demo Fill Helper for College Review / Evaluation -->
        <div class="mt-4 pt-3 border-top">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="small text-muted fw-semibold">Quick-fill Demo Accounts:</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="demo-chip" onclick="fillCredentials('admin', 'Admin@123')">
                    <i class="bi bi-shield-lock me-1"></i>Admin
                </button>
                <button type="button" class="demo-chip" onclick="fillCredentials('doctor', 'Doctor@123')">
                    <i class="bi bi-hospital me-1"></i>Doctor
                </button>
                <button type="button" class="demo-chip" onclick="fillCredentials('nurse', 'Nurse@123')">
                    <i class="bi bi-person-heart me-1"></i>Nurse
                </button>
            </div>
        </div>

        <div class="text-center mt-4">
            <span class="small text-muted">Don't have clinical access?</span>
            <a th:href="@{/register}" class="small text-decoration-none fw-semibold ms-1">Register New Staff</a>
        </div>
    </div>
</div>

<script>
    function fillCredentials(u, p) {
        document.getElementById('username').value = u;
        document.getElementById('password').value = p;
    }
</script>

</body>
</html>
