<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration — Smart Patient Health Monitoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #f8fafc 100%);
            padding: 2rem 1rem;
        }
        .auth-card {
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            padding: 2.25rem;
        }
        .auth-brand-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0284c7, #0d9488);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 1rem;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="auth-brand-icon">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Healthcare Staff Registration</h4>
            <p class="text-muted small">Create an authorized clinician or monitoring account</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/register}" th:object="${userDto}" method="post">
            <div class="row g-2 mb-3">
                <div class="col-sm-6">
                    <label class="form-label small fw-semibold">Staff Username *</label>
                    <input type="text" class="form-control" th:field="*{username}" placeholder="e.g. dr.smith" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="col-sm-6">
                    <label class="form-label small fw-semibold">Full Legal Name *</label>
                    <input type="text" class="form-control" th:field="*{fullName}" placeholder="e.g. Dr. Jane Smith" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Hospital Email Address *</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="jsmith@hospital.org" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-sm-6">
                    <label class="form-label small fw-semibold">Clinical Role *</label>
                    <select class="form-select" th:field="*{role}">
                        <option value="ROLE_DOCTOR">Physician / Doctor</option>
                        <option value="ROLE_NURSE">Registered Nurse (RN)</option>
                        <option value="ROLE_ADMIN">System Administrator</option>
                    </select>
                </div>
                <div class="col-sm-6">
                    <label class="form-label small fw-semibold">Department / Ward</label>
                    <input type="text" class="form-control" th:field="*{department}" placeholder="e.g. ICU, Cardiology">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Password * (min 6 chars)</label>
                <input type="password" class="form-control" th:field="*{password}" placeholder="Create secure password" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-person-check me-1"></i> Register Clinician Account
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <span class="small text-muted">Already registered?</span>
            <a th:href="@{/login}" class="small text-decoration-none fw-semibold ms-1">Sign In</a>
        </div>
    </div>
</div>

</body>
</html>
