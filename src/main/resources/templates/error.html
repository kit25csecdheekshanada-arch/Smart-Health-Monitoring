<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — Smart Patient Health Monitoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4 p-md-5 text-center shadow-sm" style="max-width: 520px; border-radius: 16px;">
        <div class="mb-3 text-danger">
            <i class="bi bi-exclamation-octagon" style="font-size: 3.5rem;"></i>
        </div>
        <h4 class="fw-bold mb-2">Notice / Clinical System Alert</h4>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested resource or page was not found or could not be processed.'}">An error occurred.</p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/dashboard}" class="btn btn-primary">
                <i class="bi bi-house-door me-1"></i>Return to Dashboard
            </a>
            <button onclick="history.back()" class="btn btn-outline-secondary">Go Back</button>
        </div>
    </div>
</div>

</body>
</html>
