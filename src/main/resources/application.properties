# ===================================================================
# Smart Patient Health Monitoring System - Configuration
# ===================================================================

spring.application.name=smart-patient-monitoring
server.port=8080

# Active Profile: 'dev' uses local persistent H2; 'mysql' connects to MySQL 8+
# Can be overridden via commandline: --spring.profiles.active=mysql
# or via environment variable: SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=dev

# SQL Initialization (Hibernate handles DDL automatically via ddl-auto; schema.sql is provided for manual MySQL setup)
spring.sql.init.mode=never

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Multipart / Form Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session Configuration
server.servlet.session.timeout=120m
